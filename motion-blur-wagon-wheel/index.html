<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=2160" />
    <title>Wagon-wheel effect — motion blur insert</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #06080c;
        --ink: #eef4fb;
        --ui: "Google Sans", sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 2160px;
        height: 2160px;
        overflow: hidden;
        background: var(--bg);
      }
      body {
        font-family: var(--ui);
        color: var(--ink);
      }

      #stage {
        position: relative;
        width: 2160px;
        height: 2160px;
        background: var(--bg);
      }

      /* every clip is the same full-frame box, so the two passes land the
         propeller in exactly the same place */
      .layer {
        position: absolute;
        inset: 0;
      }

      /* ── live readout: the real rotation rate, bare ──────────── */
      /* Right-aligned: the numeral's right edge sits on the propeller box's
         right edge (2160 - 400), the same 400px inset the propeller keeps on
         its left. Google Sans figures are uniform-width, so the counter does
         not jitter between frames — right-aligned, the digits stay put and
         only the tens column appears. */
      .readout {
        position: absolute;
        top: 300px;
        left: 0;
        width: 2160px;
        padding-right: 400px;
        text-align: right;
      }
      .r-val {
        font-family: var(--ui);
        font-weight: 700;
        font-size: 208px;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.02em;
      }

      /* ── the propeller ──────────────────────────────────────── */
      .prop {
        position: absolute;
        left: 400px;
        top: 700px;
        width: 1360px;
        height: 1360px;
      }
      .prop-svg {
        display: block;
        width: 1360px;
        height: 1360px;
      }
      /* the accumulation buffer: sub-frame copies are summed, not stacked.
         the blur is a dither pass, applied equally to both passes, that
         dissolves the 5/255 coverage steps the 8-bit composite leaves behind.
         the radius is in SVG user units, so it tracks the display scale:
         2.5 user units at 1360/560 ≈ 6 screen px on the 2160 canvas. */
      .accum {
        isolation: isolate;
        filter: blur(2.5px);
      }
    </style>
  </head>
  <body>
    <!-- shared geometry: one blade set + one hub, instanced by every sample layer -->
    <svg id="lib" width="0" height="0" aria-hidden="true" style="position: absolute">
      <defs>
        <radialGradient id="hubGrad" cx="0.38" cy="0.32" r="0.78">
          <stop offset="0" stop-color="#6d7d92" />
          <stop offset="1" stop-color="#222a36" />
        </radialGradient>
        <g id="bladeset">
          <path
            transform="rotate(0)"
            fill="#f0f0f0"
            d="M -16 -40 C -44 -104, -50 -180, -26 -238 C -14 -266, 20 -264, 30 -232 C 48 -174, 36 -100, 16 -40 Z"
          />
          <path
            transform="rotate(120)"
            fill="#f0f0f0"
            d="M -16 -40 C -44 -104, -50 -180, -26 -238 C -14 -266, 20 -264, 30 -232 C 48 -174, 36 -100, 16 -40 Z"
          />
          <path
            transform="rotate(240)"
            fill="#f0f0f0"
            d="M -16 -40 C -44 -104, -50 -180, -26 -238 C -14 -266, 20 -264, 30 -232 C 48 -174, 36 -100, 16 -40 Z"
          />
        </g>
        <g id="hub">
          <circle r="50" fill="url(#hubGrad)" />
          <circle r="50" fill="none" stroke="rgba(238,244,251,0.22)" stroke-width="2" />
          <circle r="22" fill="#0b1017" />
        </g>
      </defs>
    </svg>

    <div
      id="stage"
      data-composition-id="main"
      data-start="0"
      data-duration="24"
      data-fps="24"
      data-width="2160"
      data-height="2160"
    >
      <!-- chrome runs across both passes; the ramp is identical in each, so
           one readout serves both -->
      <div id="chrome" class="clip layer" data-start="0" data-duration="24" data-track-index="1">
        <div class="readout"><span id="valSpeed" class="r-val">0.0</span></div>
      </div>

      <!-- pass 1: no motion blur -->
      <div id="passA" class="clip layer" data-start="0" data-duration="15" data-track-index="2">
        <div class="prop">
          <svg class="prop-svg" viewBox="0 0 560 560">
            <g id="accumA" class="accum" data-layout-allow-overflow="true"></g>
            <g transform="translate(280,280)"><use href="#hub" /></g>
          </svg>
        </div>
      </div>

      <!-- pass 2: the same ramp again, integrated over the shutter -->
      <div id="passB" class="clip layer" data-start="15" data-duration="9" data-track-index="3">
        <div class="prop">
          <svg class="prop-svg" viewBox="0 0 560 560">
            <g id="accumB" class="accum" data-layout-allow-overflow="true"></g>
            <g transform="translate(280,280)"><use href="#hub" /></g>
          </svg>
        </div>
      </div>
    </div>

    <script>
      // ─────────────────────────────────────────────────────────────
      // Temporal aliasing demo. Everything below is a pure function of
      // composition time t — no clocks, no randomness, no accumulation.
      // Two passes over the same 0 -> 15 rev/s ramp: no motion blur held for
      // 15s, then motion blur replayed faster, in 9s.
      // ─────────────────────────────────────────────────────────────
      const FPS = 24;
      const BLADES = 3;
      const PERIOD = 360 / BLADES; // 120deg — the propeller's own symmetry
      // Each pass sweeps the identical 0 -> W_MAX speed range; only the time
      // it is given differs. The crisp pass gets the long look because every
      // aliasing landmark has to be read off it; the blurred pass is the
      // answer, so it replays the same sweep at 15/9 the acceleration.
      const RAMP_A = 15; // seconds of ramp in the crisp pass
      const RAMP_B = 9; // seconds of ramp in the blurred pass
      const W_MAX = 15; // rev/s reached at the end of either ramp
      const DUR = RAMP_A + RAMP_B; // crisp pass, then blurred pass

      // Shutter angle: the fraction of the frame interval the blurred pass
      // integrates over. 360deg = the whole of 1/24s, centered on the frame
      // time so its mean angle still matches the crisp pass.
      const SHUTTER = 360;
      const OPEN = SHUTTER / 360; // duty cycle of the frame interval
      // 80 sub-frame samples: 240/80 = 3.0 exactly per 8-bit channel, so the
      // sum of N copies is exact and neither drifts in colour nor bands.
      const SAMPLES = 80;

      // A linear ramp, not an ease. The aliasing period in speed is
      // FPS / BLADES = 8 rev/s (one whole 120deg pattern period per frame);
      // half of that is the Nyquist point. The landmarks sit at fixed speeds,
      // so constant acceleration spaces them evenly down whichever pass:
      //    4 rev/s  ->  60deg/frame — half a period: the blades jump back
      //                 and forth, direction is lost (A 4.0s, B 2.4s)
      //    8 rev/s  -> 120deg/frame — one whole period: dead still
      //                 (A 8.0s, B 4.8s)
      //   12 rev/s  -> 180deg/frame — folds to 60deg: Nyquist again
      //                 (A 12.0s, B 7.2s)
      // Between 4 and 8 the propeller reads as running backwards; past 8 it
      // reads forwards again, and the ramp ends at 15 rev/s = 225deg/frame,
      // which folds to -15deg: a 1 rev/s backwards crawl at full speed.
      const clamp = (x, lo, hi) => (x < lo ? lo : x > hi ? hi : x);
      const speedAt = (u, ramp) => (W_MAX * clamp(u, 0, ramp)) / ramp;

      // Exact integral of speedAt, so any sub-frame time evaluates directly.
      function revsAt(u, ramp) {
        const c = clamp(u, 0, ramp);
        return (W_MAX * c * c) / (2 * ramp) + (u > ramp ? W_MAX * (u - ramp) : 0);
      }

      // ── build the accumulation buffers ──────────────────────────
      const SVG_NS = "http://www.w3.org/2000/svg";
      function buildSamples(hostId, count) {
        const host = document.getElementById(hostId);
        const layers = [];
        for (let j = 0; j < count; j++) {
          const g = document.createElementNS(SVG_NS, "g");
          if (count > 1) {
            // opacity 1/N summed additively over black == arithmetic mean
            g.style.mixBlendMode = "plus-lighter";
            g.style.opacity = String(1 / count);
          }
          const u = document.createElementNS(SVG_NS, "use");
          u.setAttribute("href", "#bladeset");
          g.appendChild(u);
          host.appendChild(g);
          layers.push(g);
        }
        return layers;
      }
      const layersA = buildSamples("accumA", 1);
      const layersB = buildSamples("accumB", SAMPLES);

      // Fold into the propeller's own 120deg symmetry before writing: keeps the
      // rasteriser off huge angles, so a genuinely frozen sample set is
      // bit-identical frame to frame instead of drifting by a few LSBs of AA.
      const setAngle = (g, deg) => {
        let a = deg % PERIOD;
        if (a < 0) a += PERIOD;
        if (a > PERIOD - 1e-6) a = 0; // a whole number of periods can land a hair under
        g.setAttribute("transform", "translate(280,280) rotate(" + a.toFixed(4) + ")");
      };

      const valSpeed = document.getElementById("valSpeed");

      function paint(t) {
        // local time inside whichever pass is on screen, and that pass's own
        // ramp length; the framework owns which of the two clips is visible,
        // this just feeds them both
        const inA = t < RAMP_A;
        const u = inA ? t : t - RAMP_A;
        const ramp = inA ? RAMP_A : RAMP_B;
        setAngle(layersA[0], revsAt(u, RAMP_A) * 360);
        for (let j = 0; j < SAMPLES; j++) {
          const dt = (((j + 0.5) / SAMPLES - 0.5) * OPEN) / FPS;
          setAngle(layersB[j], revsAt(u + dt, RAMP_B) * 360);
        }
        valSpeed.textContent = speedAt(u, ramp).toFixed(1);
      }
      paint(0); // seed frame 0 before the timeline exists

      // ── timeline ────────────────────────────────────────────────
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const drv = { t: 0 };
      tl.to(drv, { t: DUR, duration: DUR, ease: "none", onUpdate: () => paint(drv.t) }, 0);

      tl.seek(0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
